# Alternative: Multi-Task Job Configuration
# NOTE: This requires REGULAR PySpark notebooks (not DLT notebooks)
# Use this if you need explicit task-level control and don't want DLT

resources:
  jobs:
    customer_medallion_multitask:
      name: customer_medallion_multitask
      
      max_concurrent_runs: 1
      timeout_seconds: 7200
      
      email_notifications:
        on_failure:
          - ambati-ganga.sindhu@capgemini.com
      
      # Task 1: Bronze Layer
      tasks:
        - task_key: bronze_task
          notebook_task:
            notebook_path: /Workspace/Users/ambati-ganga.sindhu@capgemini.com/customer-dlt-project/src/bronze_customer.py
            base_parameters:
              catalog: workspace
              schema: customer
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
          timeout_seconds: 1800
        
        # Task 2: Silver Layer (depends on Bronze)
        - task_key: silver_task
          depends_on:
            - task_key: bronze_task
          notebook_task:
            notebook_path: /Workspace/Users/ambati-ganga.sindhu@capgemini.com/customer-dlt-project/src/silver_customer.py
            base_parameters:
              catalog: workspace
              schema: customer
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
          timeout_seconds: 1800
        
        # Task 3: Gold SCD Type 1 (depends on Silver)
        - task_key: gold_type1_task
          depends_on:
            - task_key: silver_task
          notebook_task:
            notebook_path: /Workspace/Users/ambati-ganga.sindhu@capgemini.com/customer-dlt-project/src/gold_customer_scd1.py
            base_parameters:
              catalog: workspace
              schema: customer
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
          timeout_seconds: 1800
        
        # Task 4: Gold SCD Type 2 (depends on Silver)
        - task_key: gold_type2_task
          depends_on:
            - task_key: silver_task
          notebook_task:
            notebook_path: /Workspace/Users/ambati-ganga.sindhu@capgemini.com/customer-dlt-project/src/gold_customer_scd2.py
            base_parameters:
              catalog: workspace
              schema: customer
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
          timeout_seconds: 1800
        
        # Task 5: Country Aggregation (depends on both Gold tasks)
        - task_key: country_aggregation_task
          depends_on:
            - task_key: gold_type1_task
            - task_key: gold_type2_task
          notebook_task:
            notebook_path: /Workspace/Users/ambati-ganga.sindhu@capgemini.com/customer-dlt-project/src/gold_customer_aggregates.py
            base_parameters:
              catalog: workspace
              schema: customer
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
          timeout_seconds: 1800
      
      tags:
        environment: production
        project: customer-medallion
        approach: multi-task
